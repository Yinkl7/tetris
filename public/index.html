<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>俄罗斯方块</title>
    <style>
      #root {
        display: flex;
        justify-content: center;
      }
      #pannel {
        background-color: #000;
        position: relative;
      }
      #next {
        position: relative;
      }
      #tip {
        border: 1px solid #000;
      }
      .btns {
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="pannel"></div>
      <div id="tip">
        <div id="next"></div>
        <div id="score"></div>
      </div>
    </div>

    <div class="btns">
      <button id="start">开始</button>
      <button id="pause">暂停</button>
      <button id="to-bottom">向下</button>
      <button id="to-left">向左</button>
      <button id="to-right">向右</button>
      <button id="to-top">向上</button>
      <button id="rotate-clock">旋转</button>
    </div>
  </body>
</html>
