<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>俄罗斯方块</title>
    <style>
      #root {
        width: 300px;
        height: 300px;
        background-color: #000;
        position: relative;
        margin: 0 auto;
      }
      .btns {
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div class="btns">
      <button id="to-bottom">向下</button>
      <button id="to-left">向左</button>
      <button id="to-right">向右</button>
      <button id="to-top">向上</button>
    </div>
  </body>
</html>
